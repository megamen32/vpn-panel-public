server {
    listen 80;
    listen [::]:80;
    server_name dns.bezrabotnyi.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dns.bezrabotnyi.com;
    ssl_certificate     /etc/letsencrypt/live/dns.bezrabotnyi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dns.bezrabotnyi.com/privkey.pem;
    client_max_body_size 8k;
    location /dns-query/ {
        proxy_pass http://192.168.2.5:8053;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
