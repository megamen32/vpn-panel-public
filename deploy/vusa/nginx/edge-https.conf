# Managed by vpn-panel scripts/deploy-all.sh.
# Public :443 is owned by the Smart Edge stream router. TLS for VUSA path
# transports terminates here after SNI vusa.bezrabotnyi.com selects :8444.
server {
    listen 127.0.0.1:8444 ssl http2;
    server_name vusa.bezrabotnyi.com;

    ssl_certificate     /etc/letsencrypt/live/vusa.bezrabotnyi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vusa.bezrabotnyi.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:EDGETLS:10m;

    access_log /var/log/nginx/edge-https-access.log;
    error_log  /var/log/nginx/edge-https-error.log;

    # Authenticated Wisp bridge. The ticket lives in the query string, so do
    # not persist it in the nginx access log. The local sidecar verifies it.
    location ^~ /wisp/ {
        access_log off;
        proxy_pass http://127.0.0.1:48081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Clients negotiate H2 on public :443. Preserve XHTTP stream-up semantics
    # on the private hop with nginx's gRPC transport.
    location ^~ /xhttp-h2-443 {
        grpc_pass grpc://127.0.0.1:20087;
        grpc_set_header Host $host;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto https;
        grpc_read_timeout 600s;
        grpc_send_timeout 600s;
    }

    location ^~ /xhttp {
        proxy_pass http://127.0.0.1:20080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ^~ /cdn-ws {
        proxy_pass http://127.0.0.1:20081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ^~ /cdn2-ws {
        proxy_pass http://127.0.0.1:20084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ^~ /grpc {
        grpc_pass grpc://127.0.0.1:20082;
        grpc_set_header Host $host;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        grpc_set_header X-Forwarded-Proto https;
        grpc_read_timeout 600s;
        grpc_send_timeout 600s;
    }

    location ^~ /hup {
        proxy_pass http://127.0.0.1:20083;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ^~ /direct-ws {
        proxy_pass http://127.0.0.1:20085;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        add_header Content-Type text/plain;
        return 200 "vusa gateway\n";
    }
}
