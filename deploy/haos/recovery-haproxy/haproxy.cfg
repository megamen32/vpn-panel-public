global
    log stdout format raw local0
    maxconn 2048
    hard-stop-after 30s

defaults
    log global
    mode http
    option dontlognull
    option http-keep-alive
    timeout connect 10s
    timeout client 5m
    timeout server 5m
    timeout http-request 30s
    timeout tunnel 1h

frontend recovery_http
    bind :8080
    mode http
    option forwardfor

    acl acme_challenge path_beg /.well-known/acme-challenge/
    acl management_host hdr(host),field(1,:),lower -i router.bezrabotnyi.com router-b.bezrabotnyi.com home.bezrabotnyi.com home-b.bezrabotnyi.com remote100.bezrabotnyi.com remote100-b.bezrabotnyi.com remote88.bezrabotnyi.com remote88-b.bezrabotnyi.com remote44.bezrabotnyi.com remote44-b.bezrabotnyi.com 88.bezrabotnyi.com 88-b.bezrabotnyi.com 44.bezrabotnyi.com 44-b.bezrabotnyi.com

    http-request redirect scheme https code 301 if management_host !acme_challenge
# BEGIN GENERATED: recovery nginx plain HTTP ACLs
    acl host_recovery_whisper hdr(host),field(1,:),lower -i whisper.bezrabotnyi.com
    acl host_recovery_books hdr(host),field(1,:),lower -i books.bezrabotnyi.com
    acl host_recovery_download hdr(host),field(1,:),lower -i download.bezrabotnyi.com
# END GENERATED: recovery nginx plain HTTP ACLs
# BEGIN GENERATED: recovery nginx plain HTTP selections
    use_backend be_recovery_nginx_public if host_recovery_whisper
    use_backend be_recovery_nginx_public if host_recovery_books
    use_backend be_recovery_nginx_public if host_recovery_download
# END GENERATED: recovery nginx plain HTTP selections
    default_backend be_100_http

frontend recovery_https_tcp
    bind :8443
    mode tcp
    option tcplog
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }

    acl sni_router req.ssl_sni -i router.bezrabotnyi.com router-b.bezrabotnyi.com
    acl sni_home req.ssl_sni -i home.bezrabotnyi.com home-b.bezrabotnyi.com
    acl sni_remote100 req.ssl_sni -i remote100.bezrabotnyi.com remote100-b.bezrabotnyi.com
    acl sni_remote88 req.ssl_sni -i remote88.bezrabotnyi.com remote88-b.bezrabotnyi.com
    acl sni_remote44 req.ssl_sni -i remote44.bezrabotnyi.com remote44-b.bezrabotnyi.com
    acl sni_cockpit88 req.ssl_sni -i 88.bezrabotnyi.com 88-b.bezrabotnyi.com
    acl sni_cockpit100 req.ssl_sni -i cockpit-b.bezrabotnyi.com
    acl sni_cockpit44 req.ssl_sni -i 44.bezrabotnyi.com 44-b.bezrabotnyi.com
# BEGIN GENERATED: recovery nginx SNI ACLs
    acl sni_recovery_whisper req.ssl_sni -i whisper.bezrabotnyi.com
    acl sni_recovery_books req.ssl_sni -i books.bezrabotnyi.com
    acl sni_recovery_download req.ssl_sni -i download.bezrabotnyi.com
# END GENERATED: recovery nginx SNI ACLs
# BEGIN GENERATED: regional ACLs
    acl sni_smart_de req.ssl_sni -i smart-de.runet.bezrabotnyi.com vk.ru smart.runet.bezrabotnyi.com
    acl sni_full_de req.ssl_sni -i full-de.runet.bezrabotnyi.com full.runet.bezrabotnyi.com
    acl sni_smart_us req.ssl_sni -i smart-us.runet.bezrabotnyi.com
    acl sni_full_us req.ssl_sni -i full-us.runet.bezrabotnyi.com
    acl sni_fi_helsinki req.ssl_sni -i fi.runet.bezrabotnyi.com fin.bezrabotnyi.com
# END GENERATED: regional ACLs
    acl sni_runet_vpn req.ssl_sni -i ya.ru runet.bezrabotnyi.com

# BEGIN GENERATED: regional selections
    use_backend be_smart_de if sni_smart_de
    use_backend be_full_de if sni_full_de
    use_backend be_smart_us if sni_smart_us
    use_backend be_full_us if sni_full_us
    use_backend be_fi_helsinki if sni_fi_helsinki
# END GENERATED: regional selections
    use_backend be_runet_vpn if sni_runet_vpn
    use_backend be_home_tls if sni_home
    use_backend be_local_tls if sni_router || sni_remote100 || sni_remote88 || sni_remote44 || sni_cockpit88 || sni_cockpit100 || sni_cockpit44
# BEGIN GENERATED: recovery nginx SNI selections
    use_backend be_local_tls if sni_recovery_whisper
    use_backend be_local_tls if sni_recovery_books
    use_backend be_local_tls if sni_recovery_download
# END GENERATED: recovery nginx SNI selections
    default_backend be_100_https

frontend recovery_https_http
    bind :9443 accept-proxy ssl crt /data/certs/
    mode http
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Host %[req.hdr(host)]

    acl host_router hdr(host),field(1,:),lower -i router.bezrabotnyi.com router-b.bezrabotnyi.com
    acl host_home hdr(host),field(1,:),lower -i home.bezrabotnyi.com home-b.bezrabotnyi.com
    acl host_remote100 hdr(host),field(1,:),lower -i remote100.bezrabotnyi.com remote100-b.bezrabotnyi.com
    acl host_remote88 hdr(host),field(1,:),lower -i remote88.bezrabotnyi.com remote88-b.bezrabotnyi.com
    acl host_remote44 hdr(host),field(1,:),lower -i remote44.bezrabotnyi.com remote44-b.bezrabotnyi.com
    acl host_cockpit88 hdr(host),field(1,:),lower -i 88.bezrabotnyi.com 88-b.bezrabotnyi.com
    acl host_cockpit100 hdr(host),field(1,:),lower -i cockpit-b.bezrabotnyi.com
    acl host_cockpit44 hdr(host),field(1,:),lower -i 44.bezrabotnyi.com 44-b.bezrabotnyi.com
    acl protected_host hdr(host),field(1,:),lower -i router.bezrabotnyi.com router-b.bezrabotnyi.com remote100.bezrabotnyi.com remote100-b.bezrabotnyi.com remote88.bezrabotnyi.com remote88-b.bezrabotnyi.com remote44.bezrabotnyi.com remote44-b.bezrabotnyi.com 88.bezrabotnyi.com 88-b.bezrabotnyi.com cockpit-b.bezrabotnyi.com 44.bezrabotnyi.com 44-b.bezrabotnyi.com
# BEGIN GENERATED: recovery nginx TLS HTTP ACLs
    acl host_recovery_whisper hdr(host),field(1,:),lower -i whisper.bezrabotnyi.com
    acl host_recovery_books hdr(host),field(1,:),lower -i books.bezrabotnyi.com
    acl host_recovery_download hdr(host),field(1,:),lower -i download.bezrabotnyi.com
# END GENERATED: recovery nginx TLS HTTP ACLs

    http-request auth realm Recovery if protected_host !{ http_auth(mgmt_auth) }
    http-request set-header Host 192.168.2.101:8123 if host_home

    use_backend be_router_http if host_router
    use_backend be_home_http if host_home
    use_backend be_remote100_http if host_remote100
    use_backend be_remote88_http if host_remote88
    use_backend be_remote44_http if host_remote44
    use_backend be_cockpit88_https if host_cockpit88
    use_backend be_cockpit100_https if host_cockpit100
    use_backend be_cockpit44_https if host_cockpit44
# BEGIN GENERATED: recovery nginx TLS HTTP selections
    use_backend be_recovery_nginx_public if host_recovery_whisper
    use_backend be_recovery_nginx_public if host_recovery_books
    use_backend be_recovery_nginx_public if host_recovery_download
# END GENERATED: recovery nginx TLS HTTP selections
    default_backend be_100_http

frontend recovery_home_https_http
    bind :9444 accept-proxy ssl crt /data/certs/
    mode http
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    http-request set-header X-Forwarded-Host %[req.hdr(host)]
    http-request set-header Host 192.168.2.101:8123
    default_backend be_home_http

backend be_local_tls
    mode tcp
    server local_tls 127.0.0.1:9443 send-proxy-v2

backend be_home_tls
    mode tcp
    server local_home_tls 127.0.0.1:9444 send-proxy-v2

backend be_100_http
    mode http
    server roomhacker100 192.168.2.100:80 check

backend be_100_https
    mode tcp
    server roomhacker100_tls 192.168.2.100:443 check

backend be_recovery_nginx_public
    mode http
    server recovery_nginx_public 127.0.0.1:18081 check

backend be_runet_vpn
    mode tcp
    server vpn2_xray vpn2.bezrabotnyi.com:443 check inter 5s fall 2 rise 1

# BEGIN GENERATED: regional backends
backend be_smart_de
    mode tcp
    server smart-de-relay 192.168.2.100:23445 check inter 5s fall 2 rise 1

backend be_full_de
    mode tcp
    server full-de-relay 192.168.2.100:23444 check inter 5s fall 2 rise 1

backend be_smart_us
    mode tcp
    server smart-us-relay 192.168.2.100:23447 check inter 5s fall 2 rise 1

backend be_full_us
    mode tcp
    server full-us-relay 192.168.2.100:23446 check inter 5s fall 2 rise 1

backend be_fi_helsinki
    mode tcp
    server fi-helsinki-relay 192.168.2.100:23448 check inter 5s fall 2 rise 1
# END GENERATED: regional backends

backend be_router_http
    mode http
    server router 192.168.2.1:80 check

backend be_home_http
    mode http
    server homeassistant 172.30.32.1:8123 check

backend be_remote100_http
    mode http
    server nanokvm100 192.168.2.98:80 check

backend be_remote88_http
    mode http
    server nanokvm88 192.168.2.87:80 check

backend be_remote44_http
    mode http
    server nanokvm44 192.168.2.43:80 check

backend be_cockpit88_https
    mode http
    server cockpit88 192.168.2.75:9090 ssl verify none check

backend be_cockpit100_https
    mode http
    server cockpit100 192.168.2.100:9090 ssl verify none check

backend be_cockpit44_https
    mode http
    server cockpit44 192.168.2.5:9090 ssl verify none check

listen stats
    bind :8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
