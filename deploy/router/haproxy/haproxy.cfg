global
    maxconn 256

defaults
    mode tcp
    timeout connect 5s
    # HTTP CONNECT streams are long-lived; the old one-minute idle limit was
    # terminating valid browser traffic and appeared as intermittent failures.
    timeout client  5m
    timeout server  5m
    timeout tunnel  10m
    timeout check   15s

frontend proxy_in
    bind 0.0.0.0:3128
    default_backend backends

backend backends
    # A TCP accept alone does not prove that the local proxy can reach the
    # Internet. Probe a complete proxied HTTP response before sending clients
    # to it; unlike a bare CONNECT probe, it does not leave reset noise behind.
    option httpchk
    http-check send meth GET uri http://www.gstatic.com/generate_204 ver HTTP/1.1 hdr Host www.gstatic.com
    http-check expect status 204
    balance leastconn

    server s1 192.168.2.5:3128 check inter 10s fall 3 rise 2
    server s2 192.168.2.75:3128 check inter 10s fall 3 rise 2
    server s4 192.168.2.101:3128 check inter 5000 fall 2 rise 1 disabled
    # Disabled 2026-06-23: vpn2:3128 is HTTPS+auth proxy, not plain LAN HTTP backend; caused every 3rd CONNECT to abort.
    server s3 212.192.31.128:3128 check inter 5000 fall 2 rise 1 disabled


frontend us_proxy_in
    bind 0.0.0.0:3127
    default_backend us_backends

backend us_backends
    # :3127 is the US lane. server-88 selects among all VUSA transports with
    # leastPing; server-44 remains the DE-capable failover.
    option httpchk
    http-check send meth GET uri http://www.gstatic.com/generate_204 ver HTTP/1.1 hdr Host www.gstatic.com
    http-check expect status 204
    balance first

    server s88 192.168.2.75:3127 check inter 10s fall 3 rise 2
    server s44 192.168.2.5:3128 check inter 10s fall 3 rise 2 backup

frontend socks_in
    bind 0.0.0.0:1080
    default_backend socks_backends

backend socks_backends
    option tcp-check
    balance roundrobin

    server s1 192.168.2.5:1080 check inter 5000 fall 2 rise 1
    server s2 192.168.2.75:1080 check inter 5000 fall 2 rise 1

frontend lan_smart_443_in
    bind 192.168.2.1:443
    default_backend lan_smart_443_backends

backend lan_smart_443_backends
    balance first
    option tcp-check
    server s88 192.168.2.75:443 check inter 5s fall 2 rise 1
    server s44 192.168.2.5:443 check inter 5s fall 2 rise 1 backup

# GPTAdmin public web ingress on router HAProxy.
# Firewall REDIRECT should send WAN/WANB public 80 -> 18080 and 443 -> 18443.
# Primary backend is roomhacker-server-100; HAOS recovery is backup only.
frontend gptadmin_web_http_in
    bind 0.0.0.0:18080
    mode http
    option httplog
    default_backend gptadmin_web_http_backends

backend gptadmin_web_http_backends
    mode http
    balance first
    option httpchk GET /.well-known/gptadmin-router-health
    http-check send hdr Host 192.168.2.100
    server srv100 192.168.2.100:80 check inter 3000 fall 2 rise 1
    server haos 192.168.2.101:8080 check inter 5000 fall 2 rise 1 backup

frontend gptadmin_web_https_in
    bind 0.0.0.0:18443
    mode tcp
    option tcplog
    default_backend gptadmin_web_https_backends

backend gptadmin_web_https_backends
    mode tcp
    balance first
    option tcp-check
    server srv100 192.168.2.100:443 check inter 3000 fall 2 rise 1
    server haos 192.168.2.101:8443 check inter 5000 fall 2 rise 1 backup

# GPTAdmin RustDesk TCP ingress on router HAProxy.
# Public RustDesk TCP ports stay the same for clients: bezrabotnyi.com:21115-21119.
# Primary backend: server-44. Backup backend: HAOS.
# UDP 21116 is not handled here; HAProxy on OpenWrt is TCP-only.

listen rustdesk_tcp_21115
    bind 0.0.0.0:21115
    mode tcp
    balance first
    option tcp-check
    timeout client 1h
    timeout server 1h
    server s44 192.168.2.5:21115 check inter 3000 fall 2 rise 1
    server haos 192.168.2.101:21115 check inter 5000 fall 2 rise 1 backup

listen rustdesk_tcp_21116
    bind 0.0.0.0:21116
    mode tcp
    balance first
    option tcp-check
    timeout client 1h
    timeout server 1h
    server s44 192.168.2.5:21116 check inter 3000 fall 2 rise 1
    server haos 192.168.2.101:21116 check inter 5000 fall 2 rise 1 backup

