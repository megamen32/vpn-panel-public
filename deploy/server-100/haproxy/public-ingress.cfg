# Canonical server-100 public HTTPS SNI router.
# The four regional products terminate on local Xray relay ports. Every other
# hostname stays on the existing nginx estate through its loopback TLS listener.

global
    log /dev/log local0
    log /dev/log local1 notice
    user haproxy
    group haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 2m
    timeout server 2m

# LAN HTTP proxy entry point.  The OpenWrt router DNATs its legacy :3128
# address here, so forwarding does not compete for its constrained RAM.
frontend lan_http_proxy
    bind 192.168.2.100:3128
    default_backend lan_http_proxy_backends

backend lan_http_proxy_backends
    option httpchk
    http-check send meth GET uri http://www.gstatic.com/generate_204 ver HTTP/1.1 hdr Host www.gstatic.com
    http-check expect status 204
    balance leastconn
    server server44 192.168.2.5:3128 check inter 10s fall 3 rise 2
    server server88 192.168.2.75:3128 check inter 10s fall 3 rise 2

frontend public_https
    bind 192.168.2.100:443
    bind 192.168.1.100:443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }

# BEGIN GENERATED: regional ACLs
    acl sni_smart_de req.ssl_sni -i smart-de.runet.bezrabotnyi.com vk.ru smart.runet.bezrabotnyi.com
    acl sni_full_de req.ssl_sni -i full-de.runet.bezrabotnyi.com full.runet.bezrabotnyi.com
    acl sni_smart_us req.ssl_sni -i smart-us.runet.bezrabotnyi.com
    acl sni_full_us req.ssl_sni -i full-us.runet.bezrabotnyi.com
    acl sni_fi_helsinki req.ssl_sni -i fi.runet.bezrabotnyi.com fin.bezrabotnyi.com
# END GENERATED: regional ACLs

# BEGIN GENERATED: regional selections
    use_backend be_smart_de if sni_smart_de
    use_backend be_full_de if sni_full_de
    use_backend be_smart_us if sni_smart_us
    use_backend be_full_us if sni_full_us
    use_backend be_fi_helsinki if sni_fi_helsinki
# END GENERATED: regional selections
    # Search terminates on a dedicated HTTP/1.1-only Nginx listener.  Keep the
    # exact-host route ahead of the shared HTTPS backend and preserve the real
    # client address expected by the Search rate limiter.
    acl sni_search req.ssl_sni -i search.bezrabotnyi.com
    use_backend be_search_http1 if sni_search
    # TGB remains a Vite development origin.  Keep its large lazy module graph
    # off the shared HTTP/2 nginx socket.
    acl sni_tgb_http1 req.ssl_sni -i tgb.bezrabotnyi.com
    use_backend be_tgb_http1 if sni_tgb_http1
    default_backend be_local_https

backend be_local_https
    server nginx_https 127.0.0.1:8444 check

backend be_search_http1
    server search_http1 127.0.0.1:8445 send-proxy-v2 check

backend be_tgb_http1
    server tgb_http1 127.0.0.1:8447 check

# BEGIN GENERATED: regional backends
backend be_smart_de
    mode tcp
    server smart-de-relay 127.0.0.1:23445 check inter 5s fall 2 rise 1

backend be_full_de
    mode tcp
    server full-de-relay 127.0.0.1:23444 check inter 5s fall 2 rise 1

backend be_smart_us
    mode tcp
    server smart-us-relay 127.0.0.1:23447 check inter 5s fall 2 rise 1

backend be_full_us
    mode tcp
    server full-us-relay 127.0.0.1:23446 check inter 5s fall 2 rise 1

backend be_fi_helsinki
    mode tcp
    server fi-helsinki-relay 127.0.0.1:23448 check inter 5s fall 2 rise 1
# END GENERATED: regional backends
